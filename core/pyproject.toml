[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krishi-core"
version = "1.0.0"
description = "Shared preprocessing, quality, uncertainty, severity and Grad-CAM code used by BOTH training and serving (prevents train/serve skew)."
requires-python = ">=3.9"
dependencies = ["numpy", "pillow", "opencv-python-headless"]

[tool.setuptools.packages.find]
include = ["krishi_core*"]
